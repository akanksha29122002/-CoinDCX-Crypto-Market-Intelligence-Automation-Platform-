name: CoinDCX Ingestion Scheduler Cron

on:
  schedule:
    - cron: '0 * * * *'      # Runs automatically at the start of every hour, 24/7/365
  workflow_dispatch:          # Allows manual execution from the GitHub Actions tab

jobs:
  run-hourly-ingestion:
    name: Hourly API Ingest & Risk Monitor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Setup Python Runtime Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System & Application Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Pipeline (Single Run Mode)
      env:
        # Securely maps database credentials from GitHub Repository Secrets
        DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
        DATABASE_PORT: 5432
        DATABASE_USER: ${{ secrets.DATABASE_USER }}
        DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
        
        # Secures Webhook alert credentials
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        ALERT_RECEIVER_EMAIL: ${{ secrets.ALERT_RECEIVER_EMAIL }}
        
        # Volatility thresholds
        VOLATILITY_THRESHOLD: 0.08
        PRICE_DROP_THRESHOLD: 0.05
      run: |
        # Creates log directories to prevent startup write errors
        mkdir -p logs
        # Execute single ingestion run and exit cleanly
        python main.py --once
